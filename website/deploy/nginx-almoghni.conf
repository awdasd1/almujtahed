# موقع المغني — Nginx (تُستبدل example.com بنطاق الموقع عند النشر)
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/almoghni;
    index index.html;
    charset utf-8;

    # ملفات التطبيق الكبيرة تُقدَّم مباشرة بلا ضغط إضافي
    location /files/downloads/ {
        add_header Content-Disposition "attachment";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8901;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 64k;
    }

    # رفع ملفات اللوحة (مجموعات وكلاء ومشاريع قد تتجاوز ميغابايتات)
    location = /api/upload {
        proxy_pass http://127.0.0.1:8901;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 400m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # بيانات الموقع تتحدث بلا تخزين طويل
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
