version: '3.8'

services:
  almujtahed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almujtahed
    ports:
      - "${PORT:-8085}:8085"
    environment:
      - PORT=8085
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - qdrant_storage:/app/qdrant_service/storage
      - qdrant_snapshots:/app/qdrant_service/snapshots
      - shamela_data:/app/shamela4_data
      - models_data:/app/models
    restart: unless-stopped

volumes:
  qdrant_storage:
    name: almujtahed_qdrant_storage
  qdrant_snapshots:
    name: almujtahed_qdrant_snapshots
  shamela_data:
    name: almujtahed_shamela_data
  models_data:
    name: almujtahed_models_data
