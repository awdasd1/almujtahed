version: '3.8'

services:
  almujtahed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almujtahed
    ports:
      - "${PORT:-8085}:8085"
    environment:
      - PORT=8085
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6333
      - ALMUJTAHED_DATA_DIR=/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - almujtahed_data:/data
    restart: unless-stopped

volumes:
  almujtahed_data:
    name: almujtahed_data
